[project]
name = "tierlist-backend"
version = "0.1.0"
description = "Backend FastAPI de l'application TierList"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: needs a running PostgreSQL (docker compose up -d --wait)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: tri des imports, B: bugbear,
# UP: pyupgrade, SIM: simplifications, FAST: règles spécifiques FastAPI
select = ["E", "W", "F", "I", "B", "UP", "SIM", "FAST"]

[tool.ruff.lint.flake8-bugbear]
# Autorise Depends(), Query(), etc. comme valeurs par défaut (usage FastAPI)
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["app", "tests", "migrations"]
