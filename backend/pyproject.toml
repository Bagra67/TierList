[project]
name = "tierlist-backend"
version = "0.1.0"
description = "Backend FastAPI de l'application TierList"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.142.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: tri des imports, B: bugbear,
# UP: pyupgrade, SIM: simplifications, FAST: règles spécifiques FastAPI
select = ["E", "W", "F", "I", "B", "UP", "SIM", "FAST"]

[tool.ruff.lint.flake8-bugbear]
# Autorise Depends(), Query(), etc. comme valeurs par défaut (usage FastAPI)
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
