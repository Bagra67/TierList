<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Barre du navigateur mobile : --background du thème clair puis du thème sombre -->
    <meta name="theme-color" content="#F4F5FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#140F2B" media="(prefers-color-scheme: dark)" />
    <title>TierList</title>
    <style>
      /* Fond sombre dès le premier affichage : en dev, Vite injecte index.css par JavaScript, après
         ce premier affichage. Valeur à garder égale à --background du bloc .dark de index.css. */
      html.dark {
        color-scheme: dark;
        background-color: oklch(0.193 0.055 288.4);
      }
    </style>
    <script>
      // Applique le thème avant le chargement de l'application, pour éviter un flash clair en mode
      // sombre. Même logique que src/theme/index.ts ; la clé doit rester égale à THEME_STORAGE_KEY.
      (function () {
        let theme = null;
        try {
          theme = localStorage.getItem('tierlist.theme');
        } catch {
          // stockage indisponible : thème du système
        }
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (theme !== 'light' && systemDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
