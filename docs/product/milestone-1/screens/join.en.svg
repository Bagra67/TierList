<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title>Join a room</title>
<rect width="960" height="560" fill="#ffffff"/>
<rect x="0" y="0" width="960" height="52" rx="0" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1"/>
<line x1="0" y1="52" x2="960" y2="52" stroke="#a1a1aa" stroke-width="1"/>
<text x="24" y="33" font-size="18" fill="#18181b" font-weight="bold" text-anchor="start">TierList</text>
<circle cx="928" cy="26" r="13" fill="#d4d4d8" stroke="#a1a1aa"/>
<text x="906" y="31" font-size="14" fill="#71717a" font-weight="normal" text-anchor="end"></text>
<text x="480.0" y="112" font-size="22" fill="#18181b" font-weight="bold" text-anchor="middle">Join a room</text>
<text x="330" y="148" font-size="13" fill="#71717a" font-weight="normal" text-anchor="start">Room code</text>
<rect x="330" y="156" width="300" height="36" rx="4" fill="#ffffff" stroke="#a1a1aa" stroke-width="1"/>
<text x="340" y="179.0" font-size="14" fill="#18181b" font-weight="normal" text-anchor="start">K7P2QX</text>
<rect x="120" y="230" width="340" height="280" rx="6" fill="#ffffff" stroke="#a1a1aa" stroke-width="1"/>
<text x="144" y="268" font-size="16" fill="#18181b" font-weight="bold" text-anchor="start">With an account</text>
<text x="144" y="316" font-size="12" fill="#71717a" font-weight="normal" text-anchor="start">Keep this game in your history.</text>
<text x="144" y="336" font-size="12" fill="#71717a" font-weight="normal" text-anchor="start">You come back to this room after signing in.</text>
<rect x="144" y="440" width="292" height="36" rx="6" fill="#52525b" stroke="#52525b" stroke-width="1"/>
<text x="290.0" y="463.0" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">Sign in</text>
<rect x="500" y="230" width="340" height="280" rx="6" fill="#ffffff" stroke="#a1a1aa" stroke-width="1"/>
<text x="524" y="268" font-size="16" fill="#18181b" font-weight="bold" text-anchor="start">As a guest</text>
<text x="524" y="308" font-size="13" fill="#71717a" font-weight="normal" text-anchor="start">Nickname</text>
<rect x="524" y="316" width="292" height="36" rx="4" fill="#ffffff" stroke="#a1a1aa" stroke-width="1"/>
<text x="534" y="339.0" font-size="14" fill="#18181b" font-weight="normal" text-anchor="start">Lou</text>
<text x="524" y="384" font-size="12" fill="#71717a" font-weight="normal" text-anchor="start">No history. This browser remembers you,</text>
<text x="524" y="402" font-size="12" fill="#71717a" font-weight="normal" text-anchor="start">and your personal link works on any device.</text>
<rect x="524" y="440" width="292" height="36" rx="6" fill="#ffffff" stroke="#a1a1aa" stroke-width="1"/>
<text x="670.0" y="463.0" font-size="14" fill="#18181b" font-weight="normal" text-anchor="middle">Join as guest</text>
</svg>
