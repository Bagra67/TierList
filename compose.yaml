# Services de développement : base PostgreSQL et Mailpit (boîte de réception locale).
# Lancer : docker compose up -d --wait   |   Arrêter : docker compose down
services:
  db:
    image: postgres:18-alpine
    # Mêmes identifiants que le backend : POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    env_file: backend/.env
    ports:
      # Accessible uniquement depuis cette machine
      - '127.0.0.1:5432:5432'
    volumes:
      # Depuis PostgreSQL 18, l'image stocke ses données sous /var/lib/postgresql/<version>
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # Reçoit les emails envoyés par le backend sans jamais les distribuer (docs/technical/emails.md).
  # Interface web : http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1
    ports:
      # SMTP (SMTP_HOST=127.0.0.1, SMTP_PORT=1025) et interface web, depuis cette machine seulement
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    restart: unless-stopped

volumes:
  postgres-data:
